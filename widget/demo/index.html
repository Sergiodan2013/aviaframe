<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aviaframe Widget Test</title>
  <style>
    body { margin: 0; padding: 24px; background: #f4f7ff; font-family: Arial, sans-serif; }
    .wrap { max-width: 1200px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Тест виджета</h1>
    <p style="margin:0 0 16px;color:#475569">
      Для end-to-end бронирования используйте <code>?agency_key=YOUR_AGENCY_PUBLIC_WIDGET_KEY</code> на allowlisted demo domain.
    </p>
    <div
      id="aviaframe-widget"
      data-aviaframe-widget
      data-api-url="/api/drct/search"
      data-checkout-url="/booking"
      data-brand-name="Бодян и Серега"
      data-title="Flight Search"
    ></div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const widgetNode = document.getElementById('aviaframe-widget');
      if (!widgetNode) return;

      const demoConfig = {
        agency_key: params.get('agency_key') || '',
        agency_domain: params.get('agency_domain') || '',
        backend_base: params.get('backend_base') || '/api/backend',
        origin_host: params.get('origin_host') || window.location.hostname || '',
        preview_mode: params.get('preview_mode') === '1' ? '1' : ''
      };

      try {
        localStorage.setItem('aviaframeDemoWidgetConfig', JSON.stringify(demoConfig));
      } catch (error) {
        console.warn('Failed to persist demo widget config:', error);
      }

      if (demoConfig.agency_key) {
        widgetNode.dataset.agencyKey = demoConfig.agency_key;
      }
      if (demoConfig.origin_host) {
        widgetNode.dataset.siteOriginHost = demoConfig.origin_host;
      }
    })();
  </script>
  <script src="./aviaframe-widget.js"></script>
</body>
</html>
