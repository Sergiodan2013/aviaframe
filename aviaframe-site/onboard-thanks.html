<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Submitted — AviaFrame</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4ff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid #dbe7ff;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 15px; color: #475569; line-height: 1.7; }
    .logo { font-size: 18px; font-weight: 800; color: #1d4ed8; margin-top: 32px; }
    .logo span { color: #0ea5e9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Submitted successfully</h1>
    <p>The agency onboarding form has been sent to the AviaFrame team. We'll set up the workspace and get back to you shortly.</p>
    <div class="logo">Avia<span>Frame</span></div>
  </div>
</body>
</html>
