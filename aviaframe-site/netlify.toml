[build]
  publish = "."

  [build.processing.html]
    pretty_urls = false

# Keep browser requests on the staging hostname while Railway owns the API.
[[redirects]]
  from = "/api/backend/*"
  to = "https://peaceful-amazement-production-629f.up.railway.app/:splat"
  status = 200

[[redirects]]
  from = "/api/drct/search"
  to = "https://peaceful-amazement-production-629f.up.railway.app/webhook/drct/search"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
